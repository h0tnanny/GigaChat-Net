name: Publish Release NuGet Packages

on:
  push:
    tags:
      - v*
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  GIGACHAT_BASE_URL: https://example.test/api/v1
  GIGACHAT_AUTH_URL: https://auth.example.test/oauth
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  GITHUB_PACKAGES_SOURCE: https://nuget.pkg.github.com/h0tnanny/index.json

jobs:
  publish-release:
    name: Publish release packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve package version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi

          VERSION="${TAG_NAME#v}"
          if [ "$TAG_NAME" = "$VERSION" ]; then
            echo "Release tag must start with v, for example v1.0.0." >&2
            exit 1
          fi

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tags must be stable SemVer, for example v1.0.0. Preview versions are published from develop." >&2
            exit 1
          fi

          git fetch origin master:refs/remotes/origin/master
          TAG_COMMIT="$(git rev-list -n 1 "$TAG_NAME")"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/master; then
            echo "Release tag $TAG_NAME must point to a commit contained in master." >&2
            exit 1
          fi

          echo "package_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate NuGet API key
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY repository secret is required to publish release packages." >&2
            exit 1
          fi

      - name: Restore
        run: dotnet restore GigaChat.Net.slnx

      - name: Build
        run: dotnet build GigaChat.Net.slnx --configuration Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test GigaChat.Net.slnx --configuration Release --no-build

      - name: Pack release packages
        run: |
          dotnet pack src/GigaChat.Net/GigaChat.Net.csproj --configuration Release --no-build --output artifacts/packages /p:PackageVersion=${{ steps.version.outputs.package_version }}
          dotnet pack src/GigaChat.Net.AspNetCore/GigaChat.Net.AspNetCore.csproj --configuration Release --no-build --output artifacts/packages /p:PackageVersion=${{ steps.version.outputs.package_version }}

      - name: Validate package frameworks
        shell: pwsh
        run: ./scripts/Validate-PackageFrameworks.ps1

      - name: Publish packages to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg)
          symbols=(artifacts/packages/*.snupkg)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "No .nupkg files were produced." >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source "$NUGET_SOURCE" --skip-duplicate --no-symbols
          done

          for symbol_package in "${symbols[@]}"; do
            dotnet nuget push "$symbol_package" --api-key "$NUGET_API_KEY" --source "$NUGET_SOURCE" --skip-duplicate
          done

      - name: Publish packages to GitHub Packages
        run: |
          dotnet nuget add source "$GITHUB_PACKAGES_SOURCE" \
            --name github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

          shopt -s nullglob
          packages=(artifacts/packages/*.nupkg)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "No .nupkg files were produced." >&2
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" --api-key "${{ secrets.GITHUB_TOKEN }}" --source "github" --skip-duplicate --no-symbols
          done
