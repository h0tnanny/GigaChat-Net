name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

env:
  GIGACHAT_BASE_URL: https://example.test/api/v1
  GIGACHAT_AUTH_URL: https://auth.example.test/oauth

jobs:
  build-test-pack:
    name: Build, test, pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore GigaChat.Net.slnx

      - name: Build
        run: dotnet build GigaChat.Net.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test GigaChat.Net.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Pack
        run: |
          dotnet pack src/GigaChat.Net/GigaChat.Net.csproj --configuration Release --no-build --output artifacts/packages /p:PackageVersion=0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
          dotnet pack src/GigaChat.Net.AspNetCore/GigaChat.Net.AspNetCore.csproj --configuration Release --no-build --output artifacts/packages /p:PackageVersion=0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
          dotnet pack src/LangChain.Providers.GigaChat/LangChain.Providers.GigaChat.csproj --configuration Release --no-build --output artifacts/packages /p:PackageVersion=0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/packages/*
          if-no-files-found: error
